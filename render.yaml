# Render Blueprint for ProfileAI
# https://render.com/docs/blueprint-spec
#
# Deploy with: New → Blueprint → connect this repo. Render creates the database
# and services in one click. After first deploy you still need to:
#   1) Open the Postgres shell and run: CREATE EXTENSION IF NOT EXISTS vector;
#   2) Fill in secret env vars (marked `sync: false`) in each service's dashboard
#   3) Open a backend shell and run: npm run init-db   (one-time, creates tables)
#   4) Add custom domain api.profilleai.com to the backend service
#   5) Add custom domain profilleai.com to the frontend static site below
#
# Workers are commented out — uncomment when ApplyPilot / scheduled jobs ship
# to candidates. Until then they're not needed and would just burn $14/mo.

databases:
  - name: profileai-db
    # MUST match the live instance type. This had drifted: production is on
    # basic-1gb (1GB RAM / 0.5 CPU / 30GB), while this file still said
    # basic-256mb — so the first Blueprint sync that actually succeeded would
    # have tried to DOWNGRADE the database under a running application.
    plan: basic-1gb
    databaseName: profileai
    user: profileai
    # The live database is on 18. Declaring 16 is what made every Blueprint sync
    # fail with "cannot downgrade Postgres major version" — and while the sync
    # was failing, NOTHING in this file reached production. The services ran on
    # dashboard values plus code defaults, which is exactly how
    # ENABLE_JOB_RETENTION=false was committed here and never applied.
    postgresMajorVersion: "18"
    ipAllowList: []          # internal-network only; no public access

services:
  # NOTE: The frontend is deployed to Cloudflare Workers Assets (see
  # wrangler.jsonc + worker.js at repo root). The previous Render static
  # site for `profilleai.com` was removed to eliminate a two-system drift
  # where Render kept rebuilding from `main` but DNS pointed at Cloudflare,
  # so frontend fixes silently never reached users until someone manually
  # ran `wrangler deploy`. If you want to move back to Render-hosted
  # frontend, restore the `profileai-web` block AND delete wrangler.jsonc.
  # Do not run both at once.

  - type: web
    name: profilleai-api
    # NOTE: name MUST match the existing production web service exactly
    # (profilleai-api — double "l", srv-d85atsbtqb8s73fsebtg — the one bound to
    # api.profilleai.com). This Blueprint previously used "profileai-api"
    # (single "l"), which did NOT match the live service, so a Blueprint Sync
    # created a SECOND, duplicate web service (srv-d86…). Two API services both
    # ran the inline cron → double sync/search load on one Postgres, which
    # contributed to the DB OOM/disk-fill. Keeping this name aligned means a
    # Sync adopts/updates the real service instead of spawning another. After
    # renaming, delete the stray single-l "profileai-api" in the dashboard.
    runtime: node
    plan: starter            # 512MB, $7/mo — does not sleep
    region: oregon           # change to ohio/frankfurt/singapore as needed
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      # Allow puppeteer to download Chromium during build. ApplyPilot's
      # auto-submit and dry-run preview adapters (greenhouse, lever,
      # ashby, workday) all use Puppeteer to fill ATS forms. With this
      # set to "true" the API container shipped without Chromium, so
      # POST /applications/:appId/preview crashed with "Could not find
      # Chrome" and the submit worker would do the same if turned on.
      # Set to "false" so the build installs Chromium into
      # /opt/render/.cache/puppeteer. Adds ~130MB to the image — if disk
      # gets tight, upgrade the API plan from starter to standard.
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "false"
      # ApplyPilot auto-submit master switch. STAGED ROLLOUT:
      #   1) ship this commit (Chromium installs but auto-submit stays OFF).
      #   2) hit POST /applications/:appId/preview from the UI — should
      #      now return real screenshots instead of the
      #      'browser_unavailable' fallback. That confirms Chromium is
      #      actually loadable in the runtime container, not just present
      #      in the build image.
      #   3) only then flip this env var to "true" via the Render
      #      dashboard (not yaml — easier to revert if a submit run
      #      misbehaves). Each approve will enqueue the submit worker.
      # Marked sync:false so the dashboard value (whichever it is) wins
      # over the yaml on every Blueprint Sync.
      - key: APPLYPILOT_AUTOSUBMIT
        sync: false
      # ApplyPilot master kill-switch. When unset OR 'false' the entire
      # /api/applypilot/* surface returns 404 and the navbar link is
      # hidden for everyone EXCEPT:
      #   - users with role='admin' (always allowed, for dogfooding)
      #   - emails in APPLYPILOT_ALLOWED_USERS (per-user tester rollout)
      # Flip to 'true' in the dashboard to expose the feature to all
      # candidates. See backend/config/featureFlags.js for the
      # userCanAccessApplyPilot helper.
      - key: ENABLE_APPLYPILOT
        sync: false
      # Comma-separated email allowlist. Lets specific testers see
      # ApplyPilot while ENABLE_APPLYPILOT is still off for everyone
      # else. Example: tester1@x.com, tester2@y.com
      - key: APPLYPILOT_ALLOWED_USERS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: profileai-db
          property: connectionString
      - key: DB_SSL
        value: "false"        # internal network, no SSL needed
      - key: JWT_EXPIRE
        value: 7d
      - key: FRONTEND_URL
        value: https://profilleai.com
      - key: ALLOWED_ORIGINS
        value: https://profilleai.com,https://www.profilleai.com
      # Feature flags — candidate-only launch
      - key: ENABLE_RECRUITER_SURFACE
        value: "false"
      - key: ENABLE_RECRUITER_AGENT_ARENA
        value: "false"
      - key: ENABLE_FEED
        value: "false"
      # Live in production: /mcp answers 400 (bad request), not 404, and the
      # route is only mounted when this is true. This file said "false", so the
      # first successful sync would have unmounted the Claude connector and its
      # OAuth endpoints and broken every already-connected client.
      #
      # ENABLE_FEED and ENABLE_RECRUITER_SURFACE were checked the same way and
      # are genuinely off in production (/api/posts, /api/smart-match and
      # /api/recruiter-profiles all 404), so those two are left as they are.
      - key: ENABLE_CLAUDE_CONNECTOR
        value: "true"
      # AI cost controls
      - key: OPENAI_JOB_MODEL
        value: gpt-4o-mini
      # External jobs sync, ApplyPilot scout, job digest, and the corpus-hygiene
      # sweeps (ghost scan, embed/skill backfill, prune, compaction, dedupe,
      # board cap) all run in the dedicated profilleai-cron-worker service
      # below, NOT here. They used to run inline on this web dyno, where up
      # to 8 concurrent batch sweeps collided with each other for Postgres
      # locks (deadlocks / lock-timeout errors from GhostScan) and with
      # request traffic for heap, crashing the process with "JavaScript heap
      # out of memory". Keep both of these "false" — flipping either back to
      # true while the worker is also deployed double-runs the same jobs on
      # two processes against one small Postgres instance, which is the exact
      # failure mode described above at line ~38.
      - key: RUN_CRON_INLINE
        value: "false"
      - key: RUN_SWEEPS_INLINE
        value: "false"
      # Drives the default feed window AND the ranking freshness horizon on this
      # service; the cron worker uses the same key for the retention sweep.
      #
      # It MUST be set in both places and kept equal. These were three separate
      # numbers once and drifted — the window was 60 days while the freshness
      # term saturated at 30, so everything older than 30 days tied at zero
      # freshness and a 59-day-old posting could lead the feed. Setting it only
      # on the worker would recreate exactly that drift the first time anyone
      # tuned it, because this service would silently stay on the code default.
      - key: JOBS_MAX_AGE_DAYS
        value: "30"
      # ───────── Secrets (set these in the Render dashboard) ─────────
      - key: JWT_SECRET
        generateValue: true   # Render generates a strong random value once
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Email (Resend recommended — set after picking provider)
      - key: EMAIL_PROVIDER
        value: resend
      - key: STRICT_BRAND_FROM
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false           # e.g. no-reply@profilleai.com
      # Stripe (only if you charge on day 1)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  # ───────── Background cron worker ─────────
  # Owns everything that used to run INLINE on the API web service: the
  # external-jobs sync, ApplyPilot scout, the daily job digest (all via
  # `npm run cron` → workers/cronWorker.js), AND the corpus-hygiene sweeps —
  # ghost scan, embed/skill backfill, prune, compaction, dedupe, board cap
  # (workers/sweepWorker.js, started from cronWorker.js's standalone entry
  # point). Splitting these onto their own $7/mo instance is what stopped the
  # repeated "[GhostScan] error: deadlock detected" / lock-timeout errors and
  # the Node "JavaScript heap out of memory" crashes: those were caused by up
  # to 8 concurrent batch sweeps colliding with each other for Postgres locks
  # and with request traffic for heap, all on one 512MB web dyno. The API's
  # RUN_CRON_INLINE and RUN_SWEEPS_INLINE must both stay "false" while this
  # worker is deployed — running both would double-run every job against one
  # small Postgres instance (the same failure mode described at line ~38).
  - type: worker
    # NOTE: name MUST match the existing production worker exactly
    # (profileai-cron-worker — SINGLE "l"). This is the opposite spelling
    # from the API service above, which is genuinely double-"l". Do not
    # "correct" this to match the API: the live worker was created with the
    # single-l name, and a Blueprint using any other spelling would not
    # match it, so a Sync would spawn a SECOND cron worker. Two workers
    # would double-run the external-jobs sync and every corpus-hygiene
    # sweep against one small Postgres — the exact deadlock/OOM failure
    # described at line ~38 and in the block above. Verify against the
    # Render dashboard before ever changing this string.
    name: profileai-cron-worker
    runtime: node
    plan: starter            # 512MB, $7/mo — dedicated to background jobs
    region: oregon           # match the API service's region
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm run cron
    autoDeploy: true
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      # No Puppeteer/Chromium needed here — none of these jobs touch a browser.
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: profileai-db
          property: connectionString
      - key: DB_SSL
        value: "false"
      - key: ENABLE_EXTERNAL_JOBS_CRON
        value: "true"
      - key: ENABLE_JOB_DIGEST_CRON
        value: "true"
      # Retention: retire postings past JOBS_MAX_AGE_DAYS (deactivate only —
      # pruneStaleInactiveJobs does the deletion later, and skips anything a
      # user saved or applied to).
      #
      # SHIPPED OFF ON PURPOSE. The code default is on, and on a corpus where
      # most postings are older than the window this retires the majority of the
      # active feed within a few hours. That is the intended behaviour, but it
      # should be started deliberately and watched, not as a side effect of a
      # deploy that also changes ranking, the digest and caching — otherwise a
      # feed that looks wrong afterwards has four possible causes.
      #
      # To enable: flip to "true" and watch GET /api/external-jobs/health.
      # Retirement is reversible (set isActive back) for PRUNE_INACTIVE_DAYS.
      - key: ENABLE_JOB_RETENTION
        value: "false"
      # Drives retention, the default feed window, AND the ranking freshness
      # horizon. These were three separate numbers and drifted apart (window 60
      # vs horizon 30), which let a 59-day-old posting lead the feed.
      - key: JOBS_MAX_AGE_DAYS
        value: "30"
      # Backfills Profile.openaiEmbedding. Without a profile vector a candidate
      # silently drops to the weaker keyword ranking path; embeddings were only
      # ever created lazily on save, so older profiles never got one.
      - key: ENABLE_PROFILE_EMBED_BACKFILL
        value: "true"
      - key: JOB_DIGEST_CRON
        value: "0 8 * * *"
      - key: FRONTEND_URL
        value: https://profilleai.com
      # Must be the SAME value as the API service's JWT_SECRET (Render
      # dashboard → profilleai-api → Environment) — the digest email's
      # magic-link tokens are signed here and verified by the API. Do NOT
      # use generateValue here, that would mint a different secret and every
      # digest link would fail verification.
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_JOB_MODEL
        value: gpt-4o-mini
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      # Job digest emails go through the same Resend setup as the API.
      - key: EMAIL_PROVIDER
        value: resend
      - key: STRICT_BRAND_FROM
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false           # e.g. no-reply@profilleai.com

  # ───────── Other background workers — uncomment when you need them ─────────
  #
  # - type: worker
  #   name: profileai-submit-worker
  #   runtime: node
  #   plan: starter
  #   rootDir: backend
  #   buildCommand: npm ci
  #   startCommand: npm run worker
  #   autoDeploy: true
  #   branch: main
  #   envVars:
  #     - fromGroup: profileai-shared       # define an env group with all the
  #                                          # shared vars to avoid duplication
