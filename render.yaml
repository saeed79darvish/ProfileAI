# Render Blueprint for ProfileAI
# https://render.com/docs/blueprint-spec
#
# Deploy with: New → Blueprint → connect this repo. Render creates the database
# and services in one click. After first deploy you still need to:
#   1) Open the Postgres shell and run: CREATE EXTENSION IF NOT EXISTS vector;
#   2) Fill in secret env vars (marked `sync: false`) in each service's dashboard
#   3) Open a backend shell and run: npm run init-db   (one-time, creates tables)
#   4) Add custom domain api.profilleai.com to the backend service
#   5) Add custom domain profilleai.com to the frontend static site below
#
# Workers are commented out — uncomment when ApplyPilot / scheduled jobs ship
# to candidates. Until then they're not needed and would just burn $14/mo.

databases:
  - name: profileai-db
    plan: basic-256mb        # $6/mo, pgvector supported. Scale up via dashboard.
    databaseName: profileai
    user: profileai
    postgresMajorVersion: "16"
    ipAllowList: []          # internal-network only; no public access

services:
  # NOTE: The frontend is deployed to Cloudflare Workers Assets (see
  # wrangler.jsonc + worker.js at repo root). The previous Render static
  # site for `profilleai.com` was removed to eliminate a two-system drift
  # where Render kept rebuilding from `main` but DNS pointed at Cloudflare,
  # so frontend fixes silently never reached users until someone manually
  # ran `wrangler deploy`. If you want to move back to Render-hosted
  # frontend, restore the `profileai-web` block AND delete wrangler.jsonc.
  # Do not run both at once.

  - type: web
    name: profileai-api
    runtime: node
    plan: starter            # 512MB, $7/mo — does not sleep
    region: oregon           # change to ohio/frankfurt/singapore as needed
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      # Skip puppeteer's Chromium download during build (would exceed disk
      # quota and isn't needed for candidate-only surface). If we later
      # enable browser-based scraping, switch to puppeteer-core + a system
      # chromium binary.
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: profileai-db
          property: connectionString
      - key: DB_SSL
        value: "false"        # internal network, no SSL needed
      - key: JWT_EXPIRE
        value: 7d
      - key: FRONTEND_URL
        value: https://profilleai.com
      - key: ALLOWED_ORIGINS
        value: https://profilleai.com,https://www.profilleai.com
      # Feature flags — candidate-only launch
      - key: ENABLE_RECRUITER_SURFACE
        value: "false"
      - key: ENABLE_RECRUITER_AGENT_ARENA
        value: "false"
      - key: ENABLE_FEED
        value: "false"
      - key: ENABLE_CLAUDE_CONNECTOR
        value: "false"
      # AI cost controls
      - key: OPENAI_JOB_MODEL
        value: gpt-4o-mini
      # External jobs sync — runs INLINE inside this web instance so the
      # /jobs list refreshes automatically (every 15 min) with no extra
      # service to provision or babysit. The cron is self-healing: on every
      # process boot it kicks an initial sweep after 10s, then continues on
      # the 15-min schedule. syncAllBoards() has an overlap guard so a deploy
      # restart can never double-run or wedge a sweep.
      - key: ENABLE_EXTERNAL_JOBS_CRON
        value: "true"
      - key: RUN_CRON_INLINE
        value: "true"
      # ───────── Secrets (set these in the Render dashboard) ─────────
      - key: JWT_SECRET
        generateValue: true   # Render generates a strong random value once
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Email (Resend recommended — set after picking provider)
      - key: EMAIL_PROVIDER
        value: resend
      - key: STRICT_BRAND_FROM
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false           # e.g. no-reply@profilleai.com
      # Stripe (only if you charge on day 1)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  # ───────── Background cron worker (OPTIONAL — disabled) ─────────
  # NOTE: The external-jobs sync runs INLINE in the API web service above
  # (ENABLE_EXTERNAL_JOBS_CRON=true / RUN_CRON_INLINE=true), so no separate
  # worker is required for jobs to stay fresh. This dedicated worker is kept
  # here, commented out, for when sync volume grows enough to warrant its own
  # process. To enable: uncomment, run a Render Blueprint Sync to create it,
  # set its secrets, then flip the API's two cron keys back to "false" so the
  # cron isn't double-run.
  #
  # - type: worker
  #   name: profileai-cron-worker
  #   runtime: node
  #   plan: starter
  #   region: oregon
  #   rootDir: backend
  #   buildCommand: npm ci
  #   startCommand: npm run cron
  #   autoDeploy: true
  #   branch: main
  #   envVars:
  #     - key: NODE_ENV
  #       value: production
  #     - key: PUPPETEER_SKIP_DOWNLOAD
  #       value: "true"
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: profileai-db
  #         property: connectionString
  #     - key: DB_SSL
  #       value: "false"
  #     - key: ENABLE_EXTERNAL_JOBS_CRON
  #       value: "true"
  #     - key: ENABLE_APPLYPILOT_SCOUT_CRON
  #       value: "false"
  #     - key: OPENAI_JOB_MODEL
  #       value: gpt-4o-mini
  #     - key: ANTHROPIC_API_KEY
  #       sync: false
  #     - key: OPENAI_API_KEY
  #       sync: false
  #     - key: VOYAGE_API_KEY
  #       sync: false

  # ───────── Other background workers — uncomment when you need them ─────────
  #
  # - type: worker
  #   name: profileai-submit-worker
  #   runtime: node
  #   plan: starter
  #   rootDir: backend
  #   buildCommand: npm ci
  #   startCommand: npm run worker
  #   autoDeploy: true
  #   branch: main
  #   envVars:
  #     - fromGroup: profileai-shared       # define an env group with all the
  #                                          # shared vars to avoid duplication
