<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allow the microphone</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f0f14; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    main { max-width: 380px; padding: 32px; text-align: center; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #a0a0b0; font-size: 14px; line-height: 1.55; margin: 0 0 20px; }
    button { background: #7c3aed; color: #fff; border: 0; border-radius: 10px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:hover { background: #8b5cf6; }
    #status { margin-top: 16px; min-height: 20px; font-size: 13px; }
    .ok { color: #22c55e; } .bad { color: #f59e0b; }
  </style>
</head>
<body>
  <main>
    <h1>Allow the microphone</h1>
    <p>ProfilleAI uses it only when you press Speak, to turn what you say into text. Audio is never stored.</p>
    <button id="allow" type="button">Allow microphone</button>
    <div id="status" role="status"></div>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
