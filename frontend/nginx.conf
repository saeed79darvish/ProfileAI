server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — let React Router handle client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache hashed asset bundles aggressively. index.html is no-cache so users
  # always see the latest deploy.
  location ~* \.(js|css|woff2?|svg|png|jpe?g|gif|webp|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Basic security headers (CSP belongs on the API + reverse proxy).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), interest-cohort=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Content-Security-Policy for the SPA. Adjust connect-src to include your
  # production API origin (set via API_ORIGIN build arg or replace inline).
  # 'unsafe-inline' for style-src is required by MUI; 'unsafe-eval' avoided.
  set $csp_default "default-src 'self'";
  set $csp_script  "script-src 'self' https://js.stripe.com https://www.paypal.com";
  set $csp_style   "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com";
  set $csp_font    "font-src 'self' data: https://fonts.gstatic.com";
  set $csp_img     "img-src 'self' data: blob: https://res.cloudinary.com https://*.googleusercontent.com";
  set $csp_connect "connect-src 'self' https://api.stripe.com https://api.openai.com https://api.anthropic.com wss: https:";
  set $csp_frame   "frame-src https://js.stripe.com https://www.paypal.com";
  set $csp_misc    "object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";
  add_header Content-Security-Policy "$csp_default; $csp_script; $csp_style; $csp_font; $csp_img; $csp_connect; $csp_frame; $csp_misc" always;
}
