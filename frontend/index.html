    <!-- interactive-widget: Android Chrome shrinks the layout for the keyboard
         instead of drawing over it, so fixed footers and 100dvh fit above it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <script>
      // iPhone Safari zooms in when a text field under 16px gets focus and never
      // zooms back, leaving the page wider than the screen. maximum-scale stops
      // that auto-zoom; iOS still allows pinch-zoom, so nothing is lost there.
      // iOS only: Android reads it as "no zoom at all".
      if (/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
        document.querySelector('meta[name="viewport"]').setAttribute(
          'content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, interactive-widget=resizes-content'
        );
      }
    </script>
