<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

      property="og:description"

    <meta name="twitter:creator" content="@profilleai" />
    <meta name="twitter:title" content="ProfilleAI — AI Resume Tailoring, Auto-Apply &amp; Negotiation Coach" />
    <meta
      name="twitter:description"
      content="Tailor resumes in seconds, auto-apply to jobs, and practice negotiation with AI agents — all powered by your single ProfilleAI profile."
    />

    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Performance hints -->
    <link rel="preconnect" href="https://api.profilleai.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.profilleai.com" />

    <!-- Structured data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ProfilleAI",
      "alternateName": ["Profille AI", "Profile AI", "ProfileAI"],
      "url": "https://www.profilleai.com",
      "logo": "https://www.profilleai.com/logo512.png",
      "description": "ProfilleAI is an AI-powered career platform that tailors resumes, auto-applies to jobs, and coaches users through salary negotiations.",
      "sameAs": [
        "https://www.linkedin.com/company/profilleai",
        "https://twitter.com/profilleai"
      ]
    }
    </script>

    <!-- Structured data: WebSite + SearchAction (sitelinks searchbox) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ProfilleAI",
      "url": "https://www.profilleai.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.profilleai.com/jobs?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "ProfilleAI",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web, Chrome",
      "url": "https://www.profilleai.com",
      "description": "AI career copilot for resume tailoring, auto-apply, and salary negotiation training.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "AI resume tailoring",
        "Chrome extension auto-apply (ApplyPilot)",
        "AI salary negotiation training",
        "Recruiter–candidate smart matching",
        "Live career feed and community"
      ]
    }
    </script>
