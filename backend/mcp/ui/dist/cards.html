<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ProfilleAI</title>
<style>
  :root {
    /* Prefer host-provided tokens; fall back to AA-contrast values. */
    --pa-bg: var(--background, transparent);
    --pa-fg: var(--foreground, #16181d);
    --pa-muted: var(--muted-foreground, #5b6472);
    --pa-border: var(--border, #e3e6ea);
    --pa-card: var(--card, #ffffff);
    --pa-primary: var(--primary, #6941c6);
    --pa-primary-fg: var(--primary-foreground, #ffffff);
    --pa-radius: var(--radius, 12px);
    --pa-good-bg: #e7f6ec; --pa-good-fg: #0f6b34;
    --pa-ok-bg: #eef1fe;  --pa-ok-fg: #3a3fd6;
    --pa-low-bg: #f2f3f5; --pa-low-fg: #4a5160;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--pa-bg); color: var(--pa-fg);
    font-family: var(--font-family, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif); }
  .pa-root { padding: 4px; }
  .pa-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 4px 10px; }
  .pa-toolbar__title { font-size: 13px; font-weight: 700; color: var(--pa-muted); letter-spacing: 0.02em; }
  .pa-grid { display: flex; flex-direction: column; gap: 10px; }
  .pa-grid--expanded { gap: 14px; }
  .pa-empty { color: var(--pa-muted); font-size: 14px; padding: 16px 4px; }

  .pa-card { background: var(--pa-card); border: 1px solid var(--pa-border);
    border-radius: var(--pa-radius); padding: 14px 16px; }
  .pa-card__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .pa-card__title { font-size: 15px; font-weight: 700; color: var(--pa-fg); line-height: 1.3; }
  .pa-card__meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; font-size: 13px; color: var(--pa-muted); }
  .pa-card__desc { margin: 8px 0 0; font-size: 13.5px; line-height: 1.45; color: var(--pa-fg);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pa-grid--expanded .pa-card__desc { -webkit-line-clamp: unset; overflow: visible; display: block; }
  .pa-card__detail { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--pa-border); }
  .pa-card__detail-text { margin: 0 0 8px; font-size: 13.5px; line-height: 1.5; color: var(--pa-fg); }
  .pa-card__detail-h { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--pa-muted); margin: 8px 0 6px; }
  .pa-list { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.5; color: var(--pa-fg); }

  .pa-card__actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .pa-btn { appearance: none; cursor: pointer; font: inherit; font-size: 13px; font-weight: 600;
    padding: 8px 14px; border-radius: 10px; border: 1px solid var(--pa-border);
    background: transparent; color: var(--pa-fg); }
  .pa-btn:hover { border-color: var(--pa-primary); color: var(--pa-primary); }
  .pa-btn--primary { background: var(--pa-primary); color: var(--pa-primary-fg); border-color: var(--pa-primary); }
  .pa-btn--primary:hover { filter: brightness(0.94); color: var(--pa-primary-fg); }
  .pa-btn--ghost { padding: 6px 10px; font-size: 12px; }
  .pa-btn:focus-visible, .pa-chip:focus-visible { outline: 2px solid var(--pa-primary); outline-offset: 2px; }

  .pa-badge { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .pa-badge--good { background: var(--pa-good-bg); color: var(--pa-good-fg); }
  .pa-badge--ok { background: var(--pa-ok-bg); color: var(--pa-ok-fg); }
  .pa-badge--low { background: var(--pa-low-bg); color: var(--pa-low-fg); }

  /* LinkedIn analysis card ------------------------------------------- */
  .pa-dials { display: flex; gap: 6px; margin-top: 12px; }
  .pa-dial { flex: 1 1 0; min-width: 0; position: relative; text-align: center; }
  .pa-dial__svg { width: 100%; max-width: 74px; height: auto; display: block; margin: 0 auto; }
  .pa-dial__track { stroke: var(--pa-border); }
  .pa-dial__value { stroke: var(--pa-low-fg); transition: stroke-dasharray 300ms ease; }
  .pa-dial--good .pa-dial__value { stroke: var(--pa-good-fg); }
  .pa-dial--ok .pa-dial__value { stroke: #b7791f; }
  .pa-dial--low .pa-dial__value { stroke: #b42318; }
  /* Centred over the arc: the ring is a fixed square, so the number tracks
     its geometric middle rather than the column's. */
  .pa-dial__num { position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 74px; height: 74px; display: flex; align-items: center;
    justify-content: center; font-size: 17px; font-weight: 700; color: var(--pa-fg); }
  .pa-dial__label { margin-top: 2px; font-size: 11px; color: var(--pa-muted); }
  .pa-card__body { margin: 12px 0 0; font-size: 13.5px; line-height: 1.5; color: var(--pa-fg); }
  .pa-fixes { margin: 10px 0 0; padding-left: 18px; font-size: 13px; line-height: 1.5; color: var(--pa-fg); }
  .pa-fixes__item { margin-bottom: 6px; }
  .pa-card__note { margin-top: 10px; font-size: 11.5px; color: var(--pa-muted); }

  .pa-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .pa-chip { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--pa-low-bg); color: var(--pa-low-fg); }
  .pa-proj { margin-bottom: 8px; }
  .pa-proj__name { font-size: 13.5px; font-weight: 600; color: var(--pa-fg); }
  .pa-proj__desc { font-size: 13px; color: var(--pa-muted); line-height: 1.45; }
</style>
</head>
<body>
<div id="root"></div>
